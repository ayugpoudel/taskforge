spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: taskforge
  datasource:
    url: ${TF_DATABASE_URL:jdbc:postgresql://localhost:15432/taskforge}
    username: ${TF_DATABASE_USER:taskforge}
    password: ${TF_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
      data-source-properties:
        socketTimeout: 3
        connectTimeout: 3
  jdbc:
    template:
      query-timeout: 3s
  data:
    redis:
      host: ${TF_REDIS_HOST:localhost}
      port: ${TF_REDIS_PORT:16379}
      timeout: 2s
      connect-timeout: 2s
      password: ${TF_REDIS_PASSWORD:}
      ssl:
        enabled: ${TF_REDIS_TLS:false}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0
server:
  address: ${TF_BIND_ADDRESS:127.0.0.1}
  port: ${TF_PORT:8080}
  tomcat:
    connection-timeout: 20s
    threads:
      max: 32
      min-spare: 4
    max-connections: 128
    accept-count: 32
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: taskforge
      role: ${TF_ROLE:api}
taskforge:
  role: ${TF_ROLE:api}
  instance-id: ${TF_INSTANCE_ID:${random.uuid}}
  auth-tokens: ${TF_AUTH_TOKENS}
  storage-endpoint: ${TF_STORAGE_ENDPOINT:http://localhost:19000}
  storage-access-key: ${TF_STORAGE_ACCESS_KEY:}
  storage-secret-key: ${TF_STORAGE_SECRET_KEY:}
  storage-bucket: ${TF_STORAGE_BUCKET:taskforge}
  lease-seconds: ${TF_LEASE_SECONDS:30}
  deadline-seconds: ${TF_DEADLINE_SECONDS:600}
  max-active-jobs: ${TF_MAX_ACTIVE_JOBS:1000}
  worker-concurrency: ${TF_WORKER_CONCURRENCY:2}
  max-attempts: ${TF_MAX_ATTEMPTS:3}
  per-owner-concurrency: ${TF_PER_OWNER_CONCURRENCY:8}
  shutdown-seconds: ${TF_SHUTDOWN_SECONDS:20}
  owner-storage-bytes: ${TF_OWNER_STORAGE_BYTES:209715200}
  retention-seconds: ${TF_RETENTION_SECONDS:604800}
  cleanup-grace-seconds: ${TF_CLEANUP_GRACE_SECONDS:3600}
logging:
  structured:
    format:
      console: logstash
