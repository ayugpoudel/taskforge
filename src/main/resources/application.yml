spring:
  application:
    name: taskforge
  datasource:
    url: ${TF_DATABASE_URL:jdbc:postgresql://localhost:15432/taskforge}
    username: ${TF_DATABASE_USER:taskforge}
    password: ${TF_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  data:
    redis:
      host: ${TF_REDIS_HOST:localhost}
      port: ${TF_REDIS_PORT:16379}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0
server:
  address: ${TF_BIND_ADDRESS:127.0.0.1}
  port: ${TF_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: taskforge
      role: ${TF_ROLE:api}
taskforge:
  role: ${TF_ROLE:api}
  instance-id: ${TF_INSTANCE_ID:${random.uuid}}
  auth-tokens: ${TF_AUTH_TOKENS}
  storage-endpoint: ${TF_STORAGE_ENDPOINT:http://localhost:19000}
  storage-access-key: ${TF_STORAGE_ACCESS_KEY}
  storage-secret-key: ${TF_STORAGE_SECRET_KEY}
  storage-bucket: ${TF_STORAGE_BUCKET:taskforge}
  lease-seconds: ${TF_LEASE_SECONDS:30}
  deadline-seconds: ${TF_DEADLINE_SECONDS:600}
  max-active-jobs: ${TF_MAX_ACTIVE_JOBS:1000}
  worker-concurrency: ${TF_WORKER_CONCURRENCY:2}
  max-attempts: ${TF_MAX_ATTEMPTS:3}
