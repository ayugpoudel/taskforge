global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: taskforge-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8080]
  - job_name: taskforge-dispatcher
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [dispatcher:8080]
  - job_name: taskforge-workers
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8080
        refresh_interval: 5s
