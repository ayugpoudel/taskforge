name: TaskForge CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taskforge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build pinned local S3 fixture
        run: docker build -f infra/Minio.Dockerfile -t taskforge-minio:2025-10-15 .
      - name: Compile and execute unit, integration, concurrency and fault tests
        run: ./gradlew --no-daemon clean check bootJar
      - name: Validate Compose and build application container
        run: |
          ./scripts/setup.sh
          docker compose config --quiet
          docker build -t taskforge-app:ci .
      - name: Validate cloud template without AWS access
        run: |
          python3 -m venv /tmp/taskforge-cfn
          /tmp/taskforge-cfn/bin/pip install cfn-lint==1.46.0
          /tmp/taskforge-cfn/bin/cfn-lint infra/aws/taskforge-stack.json
      - name: Verify repository hygiene
        run: |
          git diff --check
          test -z "$(git ls-files .env)"
