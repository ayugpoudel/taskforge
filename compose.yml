name: taskforge
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${TF_DATABASE_PASSWORD:?run scripts/setup.sh}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: taskforge-minio:2025-10-15
    build:
      context: .
      dockerfile: infra/Minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${TF_STORAGE_ACCESS_KEY:?run scripts/setup.sh}
      MINIO_ROOT_PASSWORD: ${TF_STORAGE_SECRET_KEY:?run scripts/setup.sh}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: taskforge-app:local
    build: .
    env_file: .env
    environment: &app-env
      TF_ROLE: api
      TF_BIND_ADDRESS: 0.0.0.0
      TF_DATABASE_URL: jdbc:postgresql://postgres:5432/taskforge
      TF_REDIS_HOST: redis
      TF_REDIS_PORT: 6379
      TF_STORAGE_ENDPOINT: http://minio:9000
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 512m
    healthcheck: &app-health
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
    depends_on: &app-dependencies
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  worker:
    image: taskforge-app:local
    pull_policy: never
    env_file: .env
    environment:
      <<: *app-env
      TF_ROLE: worker
    mem_limit: 512m
    stop_grace_period: 40s
    healthcheck: *app-health
    depends_on: *app-dependencies
  dispatcher:
    image: taskforge-app:local
    pull_policy: never
    env_file: .env
    environment:
      <<: *app-env
      TF_ROLE: dispatcher
    mem_limit: 384m
    healthcheck: *app-health
    depends_on: *app-dependencies
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:19090:9090"]
    mem_limit: 384m
    depends_on: [api, worker, dispatcher]
  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: taskforge
      GF_SECURITY_ADMIN_PASSWORD: ${TF_GRAFANA_PASSWORD:?run scripts/setup.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes: ["./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:13000:3000"]
    mem_limit: 384m
    depends_on: [prometheus]
volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
